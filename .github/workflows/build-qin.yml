name: Build Qin Keypad
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate prototype sources
        shell: python
        run: |
          import pathlib, json
          files = json.loads('{"settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\\nrootProject.name=\'QinKeypad\'\\ninclude \':app\'\\n", "build.gradle": "plugins { id \'com.android.application\' version \'8.7.3\' apply false }\\n", "app/build.gradle": "plugins { id \'com.android.application\' }\\nandroid { namespace \'ru.qinkeypad\'; compileSdk 35\\n defaultConfig { applicationId \'ru.qinkeypad\'; minSdk 26; targetSdk 30; versionCode 1; versionName \'0.1\' }\\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\\n}\\n", "app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\"><queries><intent><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.HOME\\"/></intent></queries><application android:label=\\"Qin Keypad Test\\" android:theme=\\"@android:style/Theme.Material.Light.NoActionBar\\" android:allowBackup=\\"false\\"><activity android:name=\\".MainActivity\\" android:exported=\\"true\\"><intent-filter><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.LAUNCHER\\"/></intent-filter><intent-filter><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.HOME\\"/><category android:name=\\"android.intent.category.DEFAULT\\"/></intent-filter></activity></application></manifest>", "app/src/main/java/ru/qinkeypad/MainActivity.java": "package ru.qinkeypad;\\nimport android.app.*;\\nimport android.os.*;\\nimport android.content.*;\\nimport android.view.*;\\nimport android.widget.*;\\nimport android.graphics.Color;\\nimport android.net.Uri;\\nimport android.provider.Settings;\\n\\npublic class MainActivity extends Activity {\\n LinearLayout root; TextView clock, info; int selected=0; boolean test=false, ignore=false; Handler handler=new Handler();\\n String[] labels={\\"Набрать номер\\",\\"Контакты\\",\\"Сообщения\\",\\"Будильник\\",\\"Настройки Android\\",\\"Обычный главный экран\\",\\"Проверка клавиш\\",\\"Касания: включены\\",\\"Выход\\"};\\n Button[] buttons=new Button[9];\\n Runnable tick=new Runnable(){public void run(){if(clock!=null)clock.setText(new java.text.SimpleDateFormat(\\"HH:mm  dd.MM\\",java.util.Locale.getDefault()).format(new java.util.Date()));handler.postDelayed(this,1000);}};\\n public void onCreate(Bundle state){super.onCreate(state);draw();handler.post(tick);}\\n void draw(){\\n root=new LinearLayout(this);root.setOrientation(1);root.setPadding(8,4,8,4);root.setBackgroundColor(Color.rgb(18,25,32));\\n clock=new TextView(this);clock.setTextColor(Color.WHITE);clock.setTextSize(24);root.addView(clock);\\n info=new TextView(this);info.setTextColor(Color.LTGRAY);info.setTextSize(12);info.setText(test?\\"Проверка: нажимайте клавиши. Назад — выход.\\":\\"Стрелки / OK / 1–9. Это тестовая версия.\\");root.addView(info);\\n ScrollView scroll=new ScrollView(this);LinearLayout list=new LinearLayout(this);list.setOrientation(1);scroll.addView(list);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));\\n for(int i=0;i<labels.length;i++){final int n=i;Button b=new Button(this);buttons[i]=b;b.setText((i+1)+\\". \\"+labels[i]);b.setTextSize(14);b.setAllCaps(false);b.setMinHeight(0);b.setMinimumHeight(0);list.addView(b,new LinearLayout.LayoutParams(-1,48*(int)Math.max(1,getResources().getDisplayMetrics().density)));b.setOnClickListener(v->{selected=n;act(n);});}\\n setContentView(root);mark();}\\n void mark(){for(int i=0;i<buttons.length;i++)buttons[i].setTextColor(i==selected?Color.rgb(0,100,180):Color.BLACK);buttons[selected].requestFocus();}\\n void open(Intent i){try{startActivity(i);}catch(Exception e){Toast.makeText(this,\\"Нет подходящего приложения или доступ запрещён\\",Toast.LENGTH_LONG).show();}}\\n void act(int n){switch(n){\\n case 0:open(new Intent(Intent.ACTION_DIAL,Uri.parse(\\"tel:\\")));break;\\n case 1:open(new Intent(Intent.ACTION_VIEW,Uri.parse(\\"content://com.android.contacts/contacts\\")));break;\\n case 2:open(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_MESSAGING));break;\\n case 3:open(new Intent(\\"android.intent.action.SHOW_ALARMS\\"));break;\\n case 4:open(new Intent(Settings.ACTION_SETTINGS));break;\\n case 5:chooseHome();break;\\n case 6:test=!test;info.setText(test?\\"Нажимайте клавиши. Назад — выход из проверки.\\":\\"Проверка завершена\\");break;\\n case 7:ignore=!ignore;labels[7]=ignore?\\"Касания: выключены здесь\\":\\"Касания: включены\\";buttons[7].setText(\\"8. \\"+labels[7]);Toast.makeText(this,\\"Удерживайте 0 для включения касаний\\",Toast.LENGTH_LONG).show();break;\\n case 8:ignore=false;finish();break;}}\\n void chooseHome(){\\n Intent home=new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);\\n java.util.ArrayList<android.content.pm.ResolveInfo> all=new java.util.ArrayList<>();\\n for(android.content.pm.ResolveInfo r:getPackageManager().queryIntentActivities(home,0))if(!r.activityInfo.packageName.equals(getPackageName()))all.add(r);\\n if(all.size()==0){open(new Intent(Settings.ACTION_HOME_SETTINGS));return;}\\n String[] names=new String[all.size()];for(int i=0;i<names.length;i++)names[i]=all.get(i).loadLabel(getPackageManager()).toString();\\n new AlertDialog.Builder(this).setTitle(\\"Открыть другой главный экран\\").setItems(names,(d,w)->{android.content.pm.ActivityInfo a=all.get(w).activityInfo;open(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME).setComponent(new ComponentName(a.packageName,a.name)));}).setNegativeButton(\\"Отмена\\",null).show();}\\n public boolean dispatchTouchEvent(android.view.MotionEvent e){return ignore||super.dispatchTouchEvent(e);}\\n public boolean onKeyDown(int code,KeyEvent e){\\n if(code==KeyEvent.KEYCODE_0&&e.getRepeatCount()>0){ignore=false;labels[7]=\\"Касания: включены\\";buttons[7].setText(\\"8. \\"+labels[7]);info.setText(\\"Касания восстановлены\\");return true;}\\n if(test){if(code==KeyEvent.KEYCODE_BACK){test=false;info.setText(\\"Проверка завершена\\");return true;}info.setText(\\"keyCode=\\"+code+\\" scan=\\"+e.getScanCode()+\\" \\"+KeyEvent.keyCodeToString(code));return true;}\\n if(code==KeyEvent.KEYCODE_DPAD_DOWN||code==KeyEvent.KEYCODE_DPAD_UP){selected=(selected+(code==20?1:8))%9;mark();return true;}\\n if(code==KeyEvent.KEYCODE_DPAD_CENTER||code==KeyEvent.KEYCODE_ENTER){act(selected);return true;}\\n if(code>=KeyEvent.KEYCODE_1&&code<=KeyEvent.KEYCODE_9){selected=code-KeyEvent.KEYCODE_1;mark();act(selected);return true;}\\n return super.onKeyDown(code,e);}\\n protected void onDestroy(){handler.removeCallbacks(tick);super.onDestroy();}\\n}\\n"}')
          for name, content in files.items():
              p=pathlib.Path(name)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding="utf-8")
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qin-keypad-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

